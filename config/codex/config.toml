#:schema https://developers.openai.com/codex/config-schema.json

# Codex personal defaults. Keep this file portable: machine-specific plugins,
# credentials, and provider settings belong in the user's local config.
model = "gpt-5.6-luna"
# Keep high quality while using Luna as the budget-safe default.
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "medium"
personality = "pragmatic"

# Engram persistent memory is enabled when the binary is available on PATH.
# These files are installed alongside this config under ~/.codex.
model_instructions_file = "~/.codex/engram-instructions.md"
experimental_compact_prompt_file = "~/.codex/engram-compact-prompt.md"

# Safety defaults: normal work stays inside the workspace and risky operations
# still require an explicit approval from the user.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Codex features used by this configuration.
[features]
multi_agent = true
memories = true
hooks = true

# Never pass common credential-shaped environment variables to agent commands.
# The canonical filters form is preferred over the legacy exclude array.
[shell_environment_policy.filters]
"*_KEY" = "exclude"
"*_API_KEY" = "exclude"
"*_APIKEY" = "exclude"
"*_SECRET" = "exclude"
"*_TOKEN" = "exclude"
"*_PASSWORD" = "exclude"
"*_PASSWD" = "exclude"
"*_CREDENTIAL" = "exclude"
"*_CREDENTIALS" = "exclude"
"*_PRIVATE_KEY" = "exclude"
"*_ACCESS_KEY" = "exclude"

# Live documentation lookup for external APIs and libraries. Use the remote
# Streamable HTTP transport to avoid an unpinned npx download on every client.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60

# Persistent Engram memory for Codex. Other Engram clients can use the same DB.
[mcp_servers.engram]
command = "engram"
args = ["mcp", "--tools=agent"]
startup_timeout_sec = 20
tool_timeout_sec = 60

# Engram's Codex plugin adds the same memory protocol and lifecycle integration
# that is enabled in Codex. The plugin files remain in Codex's local cache.
[marketplaces.engram]
source_type = "git"
source = "https://github.com/Gentleman-Programming/engram.git"
ref = "main"

[plugins."engram@engram"]
enabled = true

# Keep delegation bounded. The five roles below are narrow and complementary.
[agents]
enabled = true
# Four is the technical ceiling; AGENTS.md keeps normal work at one or two.
max_concurrent_threads_per_session = 4
# Gentle-AI parity. Codex 0.146 accepts this key; verify nested delegation
# behavior before treating it as an enforceable runtime guarantee.
max_depth = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.reviewer]
description = "Review correctness, security, regressions, missing tests, and edge cases. Read-only."
config_file = "agents/reviewer.toml"

[agents.security-auditor]
description = "Audit OWASP risks, secrets, authentication, authorization, and supply chain. Read-only."
config_file = "agents/security-auditor.toml"

[agents.debugger]
description = "Reproduce failures, identify root causes, make the smallest fix, and add regression evidence."
config_file = "agents/debugger.toml"

[agents.test-writer]
description = "Design deterministic unit, integration, contract, and regression tests for the changed behavior."
config_file = "agents/test-writer.toml"

[agents.perf-profiler]
description = "Measure performance bottlenecks and verify before/after improvements. Read-only."
config_file = "agents/perf-profiler.toml"

# Native Codex footer.
#
# Codex accepts ordered built-in item identifiers here; it does not accept a
# Claude-style executable statusline command. This is the closest native
# equivalent to config/claude/statusline.sh for Codex 0.146.0.
[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "task-progress",
  "five-hour-limit",
  "weekly-limit",
]
# Use the active .tmTheme palette for the native statusline segments.
status_line_use_colors = true
terminal_title = ["activity", "project-name", "git-branch"]
theme = "sebita"
animations = true
notifications = true
notification_condition = "unfocused"
raw_output_mode = false
