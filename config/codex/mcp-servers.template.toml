# MCP snippets for ~/.codex/config.toml.
# Context7 and Engram are enabled in the base config; this file documents the
# canonical Codex format for merging them with another local configuration.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.engram]
command = "engram"
args = ["mcp", "--tools=agent"]
