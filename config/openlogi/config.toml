schema_version = 7

[app_settings]
launch_at_login = true
check_for_updates = true
auto_install_updates = true
update_prompt_seen = true
show_in_menu_bar = true
capture_mouse_events = true
auto_download_assets = true
asset_source = "openlogi"
thumbwheel_sensitivity = 14
vertical_scroll_sensitivity = 14
smooth_scroll = false
appearance = "dark"
theme_dark = "OpenLogi Dark"
app_icon = "openlogi"
ui_radius = 12
ui_scale = "normal"
device_view_mode = "grid"

[devices]
[devices."direct:046d:b034:serial:REDACTED"]
dpi = 3200
invert_scroll = true
scroll_resolution = "low"

[devices."direct:046d:b034:serial:REDACTED".identity]
display_name = "MX Master 3S"
codename = "MX Master 3S"
kind = "mouse"

[devices."direct:046d:b034:serial:REDACTED".smartshift]
mode = "ratchet"
auto_disengage = 255
tunable_torque = 0

[devices."direct:046d:b034:serial:REDACTED".bindings]
MiddleClick = "MiddleClick"
Back = "BrowserBack"
Forward = "BrowserForward"
DpiToggle = "ToggleSmartShift"
ThumbwheelScrollUp = "HorizontalScrollLeft"
ThumbwheelScrollDown = "HorizontalScrollRight"

[devices."direct:046d:b034:serial:REDACTED".bindings.GestureButton]
Click = "LaunchpadShow"
Up = "MissionControl"
Down = "AppExpose"
Left = "PreviousDesktop"
Right = "NextDesktop"
