[modes.plan]
network = false
readonly = true
approvedTools = [ ]
allowOverrides = true

[modes.default]
network = false
readonly = false
approvedTools = [
  "cat",
  "ls",
  "grep",
  "head",
  "tail",
  "less",
  "echo"
]
allowOverrides = true

[modes.accepting_edits]
network = false
readonly = false
approvedTools = [
  "sed",
  "grep",
  "awk",
  "perl",
  "cat",
  "echo"
]
allowOverrides = true

[commands.pytest]
# Change this to your pyenv path or remove if not using pytest with pyenv
allowed_paths = [ "$HOME/.pyenv/versions" ]
allow_network = false
