# gitleaks configuration — developer-friendly defaults
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# This config suppresses common false positives in dev environments.
# Extend with your own allowlist rules as needed.

title = "dotfiles gitleaks config"

[allowlist]
  description = "Common dev false positives that should never block a commit"

  # Files that often contain placeholder/template values
  paths = [
    '''(^|/)README\.md$''',
    '''(^|/)CHANGELOG\.md$''',
    '''(^|/)\.env\.example$''',
    '''(^|/)\.env\.local$''',
    '''(^|/)\.vscode/.*$''',
    '''(^|/)node_modules/.*$''',
    '''(^|/)vendor/.*$''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)bun\.lock$''',
    '''(^|/)\.gitleaks\.toml$''',
  ]

  # Placeholder/template regexes — not real secrets
  regexes = [
    '''(?i)(example|placeholder|template|dummy|test|fake|demo)_?(key|token|secret|password|api)''',
    '''(?i)your[_-]?(key|token|secret|password|api)''',
    '''(?i)sk-test-''',
    '''(?i)ghp_xxxxxxxxxxxxxxxxxxxx''',
  ]

  # Stop-words — lines containing these are skipped
  stopwords = [
    '''gitleaks:allow''',
    '''secrets:off''',
  ]
