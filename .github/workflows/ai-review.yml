name: GGA Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'config/claude/skills/**'
      - '.github/test/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GGA (pinned by SHA, not mutable tag)
        run: |
          git clone --depth 1 --branch v2.10.1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          test "$(git -C /tmp/gga rev-parse HEAD)" = "1124c3672f082c56b033c4e23a30e95d0e8cd593" || {
            echo "GGA clone is not the pinned commit"; exit 1
          }
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      - name: Install OpenCode (pinned version)
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.23

      - name: Install review skill (thermo-nuclear)
        run: |
          mkdir -p "$HOME/.config/opencode/skills/thermo-nuclear-code-quality-review"
          cp .github/code-review/skills/thermo-nuclear-code-quality-review/SKILL.md \
            "$HOME/.config/opencode/skills/thermo-nuclear-code-quality-review/SKILL.md"

      - name: Run code review and post comment
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_CODING_PLAN_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # OpenCode carga esta config adicional en vez de una en la raiz del repo.
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/code-review/opencode.json
        run: |
          # GGA solo lee .gga desde el CWD; el runner es efimero, la raiz del repo queda limpia.
          cp .github/code-review/.gga ./.gga

          # Reglas = AGENTS.md + skill termonuclear SIEMPRE en el prompt (deterministico).
          cat .github/code-review/AGENTS.md > .gga-rules.md
          printf '\n\n---\n\n# Appended: mandatory review skill (its quality bar applies on top of the rules above)\n\n' >> .gga-rules.md
          cat .github/code-review/skills/thermo-nuclear-code-quality-review/SKILL.md >> .gga-rules.md

          # Contexto barato de archivos cambiados (name-status). Sin diff completo:
          # --diff-only en GGA v2.10.1 infla el payload (diff completo + files completos).
          # opened/reopened: todo el PR (pr-mode). synchronize: solo commits nuevos (GGA --ci, incremental).
          echo "" >> .gga-rules.md
          echo "# Changed files (name-status):" >> .gga-rules.md
          set +e
          if [[ "${{ github.event.action }}" == "synchronize" ]]; then
            BEFORE="${{ github.event.before }}"
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-status "$BEFORE"..HEAD >> .gga-rules.md || true
              GGA_CI_SOURCE_COMMIT="$BEFORE" gga run --ci | tee review-output.txt
            else
              # Force-push o historial no disponible: revisar todo el PR.
              git diff --name-status origin/main...HEAD >> .gga-rules.md || true
              gga run --pr-mode | tee review-output.txt
            fi
          else
            git diff --name-status origin/main...HEAD >> .gga-rules.md || true
            gga run --pr-mode | tee review-output.txt
          fi
          code=${PIPESTATUS[0]}

          # Comentario (CodeRabbit style: actualiza el anterior, solo el review, cap 300 lineas).
          bash .github/scripts/ai-review-comment.sh review-output.txt --publish
          # Gate por severidad: solo 🔴 bloquea el check (🟡/🟣 pasan).
          bash .github/scripts/ai-review-gate.sh "$code" comment.md
