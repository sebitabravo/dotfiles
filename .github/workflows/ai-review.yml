name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OPENCODE_VERSION: 1.18.23
  OPENCODE_ASSET: opencode-linux-x64.tar.gz
  OPENCODE_SHA256: ab7015cd8113e011a461f30a0c2b77d8299a144ff688cb62e93e8802835d7288

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    outputs:
      base_sha: ${{ steps.bind.outputs.base_sha }}
      head_sha: ${{ steps.bind.outputs.head_sha }}
      check_run_id: ${{ steps.bind.outputs.check_run_id }}
    steps:
      - name: Checkout PR head (same-repo, no forks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: bind
        name: Fetch and bind immutable PR objects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid base SHA" >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid head SHA" >&2; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "invalid head repository" >&2; exit 1; }
          git -c core.hooksPath=/dev/null -c protocol.version=2 fetch --no-tags origin "$BASE_SHA"
          git -c core.hooksPath=/dev/null -c protocol.version=2 fetch --no-tags --unshallow origin
          git -c core.hooksPath=/dev/null -c protocol.version=2 fetch --no-tags "https://github.com/${HEAD_REPO}.git" "$HEAD_SHA"
          git -c core.hooksPath=/dev/null cat-file -e "${BASE_SHA}^{commit}"
          git -c core.hooksPath=/dev/null cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE=$(git -c core.hooksPath=/dev/null merge-base "$BASE_SHA" "$HEAD_SHA")
          git -c core.hooksPath=/dev/null merge-base --is-ancestor "$MERGE_BASE" "$HEAD_SHA"
          test -n "$MERGE_BASE"
          check_run_id=$(REPOSITORY="$REPOSITORY" PR_NUMBER="$PR_NUMBER" BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" RUN_ID="$RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" .github/scripts/ai-review-check-run.sh create)
          [[ "$check_run_id" =~ ^[0-9]+$ ]] || { echo "invalid check run id" >&2; exit 1; }
          python3 .github/scripts/ai-review-manifest.py --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --policy .github/code-review/AGENTS.md --manifest "$RUNNER_TEMP/review-manifest.json" --prompt "$RUNNER_TEMP/review-prompt.txt"
          cp "$RUNNER_TEMP/review-manifest.json" .
          cp "$RUNNER_TEMP/review-prompt.txt" .
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "check_run_id=$check_run_id"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable review input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-manifest.json
            review-prompt.txt
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: analyze
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout PR head (same-repo, no forks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable review input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-input
      - name: Install verified OpenCode release
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/anomalyco/opencode/releases/tags/v${OPENCODE_VERSION}"
          release_json=""
          release_json=$(curl --fail --silent --show-error --location "$api")
          asset_url=$(python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x.get("name")==sys.argv[1]]; assert len(a)==1 and a[0].get("browser_download_url","").startswith("https://github.com/anomalyco/opencode/releases/download/v"+sys.argv[2]+"/"); print(a[0]["browser_download_url"])' "$OPENCODE_ASSET" "$OPENCODE_VERSION" <<<"$release_json")
          curl --fail --silent --show-error --location "$asset_url" -o "$RUNNER_TEMP/$OPENCODE_ASSET"
          echo "$OPENCODE_SHA256  $RUNNER_TEMP/$OPENCODE_ASSET" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/$OPENCODE_ASSET" -C "$RUNNER_TEMP/opencode"
          test -x "$RUNNER_TEMP/opencode/opencode"
      - name: Run isolated review and validate strict report
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_CODING_PLAN_KEY }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          OPENCODE_PURE: "1"
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          AI_REVIEW_TMPDIR: ${{ runner.temp }}/ai-review-work
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/isolated-home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_DATA_HOME="$HOME/data"
          export XDG_CACHE_HOME="$HOME/cache"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          OPENCODE_CONFIG_CONTENT=""
          OPENCODE_CONFIG_CONTENT="$(python3 -c 'import json; c=json.load(open(".github/code-review/opencode.json")); c["agent"]["review"]["prompt"]=open(".github/code-review/AGENTS.md", encoding="utf-8").read(); print(json.dumps(c, ensure_ascii=False))')"
          export OPENCODE_CONFIG_CONTENT
          .github/scripts/ai-review-run.sh \
            "$RUNNER_TEMP/opencode/opencode" \
            review-input/review-prompt.txt \
            review-input/review-manifest.json \
            "$RUNNER_TEMP/validated-report.json"
      - name: Upload validated report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-report.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: [prepare, analyze]
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout PR head (same-repo, no forks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-report
      - name: Publish owned review comments
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: python3 .github/scripts/ai-review-comment.py review-report/validated-report.json --publish --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  review-gate:
    name: review-gate
    if: always()
    needs: [prepare, analyze, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout PR head (same-repo, no forks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated report when available
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ai-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-report
      - name: Enforce terminal review gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_RUN_ID: ${{ needs.prepare.outputs.check_run_id }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          gate_status=success
          if [[ "$ANALYZE_RESULT" != success || "$PUBLISH_RESULT" != success || ! -s review-report/validated-report.json ]]; then
            gate_status=failure
          elif ! UPSTREAM_STATUS=success .github/scripts/ai-review-gate.sh review-report/validated-report.json; then
            gate_status=failure
          fi
          test -n "$CHECK_RUN_ID"
          REPOSITORY="$REPOSITORY" PR_NUMBER="$PR_NUMBER" BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" CHECK_RUN_ID="$CHECK_RUN_ID" GATE_CONCLUSION="$gate_status" .github/scripts/ai-review-check-run.sh finalize
          [[ "$gate_status" == success ]]
