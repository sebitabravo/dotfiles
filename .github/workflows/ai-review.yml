name: GGA Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'config/claude/skills/**'
      - '.github/test/**'

permissions:
  contents: read
  # gh pr comment + PATCH de issue comments requieren issues: write.
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install GGA (pinned by SHA, not mutable tag)
        run: |
          git clone --depth 1 --branch v2.10.1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          test "$(git -C /tmp/gga rev-parse HEAD)" = "1124c3672f082c56b033c4e23a30e95d0e8cd593" || {
            echo "GGA clone is not the pinned commit"; exit 1
          }
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      - name: Install OpenCode (checksum-verified)
        run: |
          expected=$(awk -F'|' '$1=="OpenCode"{print $2}' config/install/remote-installers.sha256)
          if [[ -z "$expected" ]]; then
            echo "::error::no OpenCode entry in config/install/remote-installers.sha256" >&2
            exit 1
          fi
          curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh
          actual=$(shasum -a 256 /tmp/opencode-install.sh | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::OpenCode installer checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          bash /tmp/opencode-install.sh --version 1.18.23

      - name: Run code review and post comment
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_CODING_PLAN_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # OpenCode carga esta config adicional en vez de una en la raiz del repo.
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/code-review/opencode.json
        run: |
          # GGA solo lee .gga desde el CWD; el runner es efimero, la raiz del repo queda limpia.
          cp .github/code-review/.gga ./.gga

          # Reglas = AGENTS.md + skill termonuclear SIEMPRE en el prompt (deterministico).
          # Un solo bloque de redireccion (evita SC2129 con redirects individuales).
          {
            cat .github/code-review/AGENTS.md
            printf '\n\n---\n\n# Appended: mandatory review skill (its quality bar applies on top of the rules above)\n\n'
            cat .github/code-review/skills/thermo-nuclear-code-quality-review/SKILL.md
            echo ""
            ACTION="${{ github.event.action }}"
            BASE="${{ github.event.pull_request.base.ref }}"
            BEFORE="${{ github.event.before }}"
            BASE="${BASE:-main}"
            if [[ "$ACTION" == "synchronize" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..HEAD"
              LABEL="Diff for this push only"
            else
              RANGE="origin/${BASE}...HEAD"
              LABEL="Full PR diff"
            fi
            echo ""
            echo "## Changed files (name-status) — $LABEL ($RANGE)"
            echo '```'
            git diff --name-status "$RANGE" 2>/dev/null || true
            echo '```'
            echo ""
            echo "## $LABEL ($RANGE)"
            echo "Review ONLY the changed lines shown in the diff (unified diff + name-status), cite file:line from '+' side."
            echo '```diff'
            # Per-file truncation up to 150k covers 95% of cases; caps outlier without duplicating payload (auditor #3, veredicto 5).
            CAP=150000
            total=0
            omitted=()
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              diff_out=$(git diff --unified=3 "$RANGE" -- "$f" 2>/dev/null || true)
              [[ -z "$diff_out" ]] && continue
              size=$(printf '%s' "$diff_out" | wc -c)
              if (( total + size > CAP )); then
                omitted+=("$f")
                continue
              fi
              printf '%s\n' "$diff_out"
              total=$((total + size))
            done < <(git diff --name-only "$RANGE" 2>/dev/null || true)
            if (( ${#omitted[@]} > 0 )); then
              echo ""
              echo "# Omitted files (over cap ${CAP} bytes): ${omitted[*]}"
            fi
            echo '```'
            if [[ "$ACTION" == "synchronize" ]]; then
              echo ""
              echo "> Note: This is a synchronize push — prioritize findings in the labeled diff section above; do not re-report already-fixed files unless they still appear in the diff."
            fi
          } > .gga-rules.md

          # Variante dinamica por tamano del diff (veredicto 5): PRs chicos -> high, grandes -> low.
          # Antes de calibrar timeout contra outlier, calibrar payload: 600k + 74 files duplica el prompt.
          # GGA --pr-mode ya envia "FILES TO REVIEW" (contenido completo filtrado por EXCLUDE_PATTERNS);
          # el diff embebido en RULES_FILE es complementario (lineas '+' para anclar inline comments),
          # no duplicado exacto, pero con CAP 150k se mantiene acotado.
          diff_size=$(git diff "$RANGE" 2>/dev/null | wc -c)
          diff_size=${diff_size//[^0-9]/}
          diff_size=${diff_size:-0}
          if (( diff_size < 60000 )); then
            dyn_variant="high"
          else
            dyn_variant="low"
          fi
          if grep -q '^OPENCODE_VARIANT=' ./.gga 2>/dev/null; then
            tmp_gga=$(mktemp)
            sed "s/^OPENCODE_VARIANT=.*/OPENCODE_VARIANT=\"$dyn_variant\"/" ./.gga > "$tmp_gga" && mv "$tmp_gga" ./.gga
          else
            echo "OPENCODE_VARIANT=\"$dyn_variant\"" >> ./.gga
          fi
          echo "Review variant: $dyn_variant (diff ${diff_size} bytes, threshold 60000)" >&2

          set +e
          # PR completo en cada push (opened y synchronize) como al principio.
          gga run --pr-mode | tee review-output.txt
          code=${PIPESTATUS[0]}
          # Re-armar set -e: los fallos del publish/gate NO deben esconderse.
          set -e

          # Strip ANSI for deterministic validation (GGA hardcodes colors).
          perl -pe 's/\e\[[0-9;]*m//g' review-output.txt > review-output.clean.txt

          # Infra validation: must contain STATUS line or it's an engine failure, not a review (#5).
          if ! grep -q "^STATUS: \(PASSED\|FAILED\)" review-output.clean.txt; then
            echo "::error::Review infra failure (no STATUS line) — not publishing comment" >&2
            echo "--- review-output head (clean) ---" >&2
            head -n 50 review-output.clean.txt >&2 || true
            echo "--- review-output head (raw) ---" >&2
            head -n 50 review-output.txt >&2 || true
            exit 1
          fi

          # Language/format guard (deterministic, #6): first STATUS line must be STATUS: PASSED/FAILED, no CJK.
          first_status=$(grep -m1 "^STATUS: " review-output.clean.txt || true)
          if [ -z "$first_status" ] || ! printf '%s' "$first_status" | grep -q "^STATUS: \(PASSED\|FAILED\)"; then
            echo "::error::Review output first non-empty line must be STATUS: PASSED/FAILED (got: $first_status)" >&2
            exit 1
          fi
          if grep -P "[\x{4e00}-\x{9fff}\x{3400}-\x{4dbf}]" review-output.clean.txt >/dev/null 2>&1; then
            echo "::error::Review output contains CJK characters — language violation" >&2
            grep -P "[\x{4e00}-\x{9fff}\x{3400}-\x{4dbf}]" review-output.clean.txt | head -n 5 >&2 || true
            exit 1
          elif ! grep -P "" /dev/null >/dev/null 2>&1; then
            if perl -ne 'exit 0 if /[\x{4e00}-\x{9fff}\x{3400}-\x{4dbf}]/' review-output.clean.txt 2>/dev/null; then
              echo "::error::Review output contains CJK characters — language violation" >&2
              perl -ne 'print if /[\x{4e00}-\x{9fff}\x{3400}-\x{4dbf}]/' review-output.clean.txt | head -n 5 >&2 || true
              exit 1
            fi
          fi

          # Comentario (CodeRabbit style: actualiza el anterior, solo el review, cap 300 lineas).
          bash .github/scripts/ai-review-comment.sh review-output.txt --publish
          # Gate por severidad: solo 🔴 bloquea el check (🟡/🟣 pasan).
          bash .github/scripts/ai-review-gate.sh "$code" comment.md
