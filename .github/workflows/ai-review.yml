name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'config/claude/skills/**'
      - '.github/test/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GGA (pinned)
        run: |
          git clone --depth 1 --branch v2.10.1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      - name: Install OpenCode (pinned)
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.23

      - name: Run AI review and post comment
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_CODING_PLAN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gga run --pr-mode --diff-only | tee review-output.txt
          code=${PIPESTATUS[0]}
          perl -pe 's/\e\[[0-9;]*m//g' review-output.txt > review-clean.md
          # Colapsar lista larga de archivos a una linea y truncar a 300 lineas
          file_count=$(grep -c "^  - " review-clean.md || echo 0)
          # Reemplazar bloque Files to review por conteo; si no hay bloque, mantener original
          if grep -q "^Files to review:" review-clean.md; then
            awk -v cnt="$file_count" '
              /^Files to review:/ {print "Files to review: " cnt " files — see Files changed tab"; skip=1; next}
              skip && /^$/ {skip=0; next}
              skip && /^  - / {next}
              !skip {print}
            ' review-clean.md > review-concise.md
          else
            cp review-clean.md review-concise.md
          fi
          head -n 300 review-concise.md > comment.md
          {
            echo "## 🤖 AI Review (GGA + GLM-5.3 Flash)"
            echo ""
            cat comment.md
          } > comment-final.md && mv comment-final.md comment.md
          # Actualizar comentario existente (estilo CodeRabbit) en vez de duplicar por push
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.user.login=="github-actions[bot]") | select(.body | startswith("## 🤖 AI Review"))] | last | .id' 2>/dev/null)
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments/${comment_id}" \
              -F body=@comment.md >/dev/null 2>&1 || gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi
          exit $code
