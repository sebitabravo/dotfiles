name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GGA (pinned)
        run: |
          git clone --depth 1 --branch v2.10.1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run AI review and post comment
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_CODING_PLAN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gga run --pr-mode --diff-only | tee review-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## 🤖 AI Review (GGA + GLM-5.3)"
            echo ""
            cat review-output.txt
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          exit $code
