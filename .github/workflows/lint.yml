name: Lint shell scripts

on:
  push:
    paths:
      - '**.sh'
      - '**/hooks/*'
  pull_request:
    paths:
      - '**.sh'
      - '**/hooks/*'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          check_together: 'yes'
          scandir: './config'

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shfmt (check only, no modify)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shfmt
          shfmt -d -i 2 -ci $(find config/ -name '*.sh')  # -d = diff mode (reports, never modifies)
